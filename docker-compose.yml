services:
  api:
    build:
      context: ./backend
    container_name: digital-menu-api
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public
      - ./backend/storage/logs:/var/www/html/storage/logs
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: digital_menu
      DB_USERNAME: digital_menu
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173,localhost:5174,127.0.0.1:5174,localhost:8000,127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "if [ ! -d vendor ]; then composer install; fi &&
      php artisan optimize:clear &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      (php artisan storage:link || true) &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan serve --host=0.0.0.0 --port=8000 --no-reload"

  mysql:
    image: mysql:8.4
    container_name: digital-menu-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: digital_menu
      MYSQL_USER: digital_menu
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
